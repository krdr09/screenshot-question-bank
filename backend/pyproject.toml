[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "question-practice-backend"
version = "0.1.0"
description = "本地截图题库 OCR 与刷题系统后端"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.116.1",
  "pillow==11.3.0",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "psutil==7.2.2",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
]
ocr-cpu = [
  "paddleocr==3.5.0",
  "paddlepaddle==3.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
